name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Deterministic checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Run portable no-paid quality gate
        run: python -B skills/selective-intelligence/scripts/quality_gate.py

      - name: Verify public discovery bridge
        run: python -B tools/test_discovery_bridge.py

      - name: Verify repository-native client pointers
        run: python -B tools/test_native_pointers.py

      - name: Verify ChatGPT skill adapter
        run: python -B tools/test_chatgpt_adapter.py

      - name: Verify public plugin archive
        run: python -B -m unittest tools.test_public_plugin
